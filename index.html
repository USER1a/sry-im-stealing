<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZANE Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Profile container - matches your provided design */
        .profile-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 900px;
            z-index: 10;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00CED1;
            box-shadow: 0 0 20px rgba(0, 206, 209, 0.3);
            position: relative;
        }

        .profile-picture::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 10px 10px,
                #00CED1 10%,
                transparent 15%
            );
            animation: orbit 3s linear infinite;
            z-index: -1;
            filter: blur(1px);
        }

        .profile-info {
            flex: 1;
        }

        .name {
            font-family: 'Courier New', monospace;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px #00CED1;
            margin-bottom: 8px;
            position: relative;
            display: inline-block;
        }

        .name::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00CED1, transparent);
        }

        .badges {
            display: flex;
            gap: 8px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 10px;
            max-width: 500px;
        }

        .badge {
            font-size: 18px;
        }

        .bio {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            line-height: 1.5;
            letter-spacing: 1px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 25px 0;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.7));
        }

        .social-icon:hover {
            transform: scale(1.4) rotateY(15deg);
        }

        .visitor-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 16px;
            align-self: flex-start;
            position: relative;
        }

        .visitor-icon {
            width: 20px;
            height: 20px;
            color: white;
        }

        .theme-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .theme-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .theme-button:hover {
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 206, 209, 0.2);
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            color: white;
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00CED1;
            cursor: pointer;
            border: 2px solid white;
        }

        /* Chat Interface - Integrated into your design */
        .chat-container {
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 206, 209, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            overflow: hidden;
            z-index: 15;
            box-shadow: 0 0 30px rgba(0, 206, 209, 0.2);
        }

        .chat-header {
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #00CED1;
        }

        .chat-title {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            color: #00CED1;
        }

        .chat-messages {
            padding: 15px 20px;
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 10px;
            position: relative;
            animation: fadeIn 0.3s ease-out;
            line-height: 1.4;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background: rgba(0, 206, 209, 0.2);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            text-align: right;
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 2px solid #00CED1;
        }

        .typing-indicator {
            display: flex;
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 15px;
            border-radius: 10px;
            border-bottom-left-radius: 4px;
            border-left: 2px solid #00CED1;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #00CED1;
            border-radius: 50%;
            margin: 0 3px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        .chat-input-container {
            padding: 12px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 8px 15px;
            color: white;
            font-family: 'Courier New', monospace;
            outline: none;
            font-size: 16px;
        }

        .chat-input:focus {
            border-color: #00CED1;
            box-shadow: 0 0 8px rgba(0, 206, 209, 0.5);
        }

        .send-button {
            background: rgba(0, 206, 209, 0.3);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-button:hover {
            background: rgba(0, 206, 209, 0.5);
            transform: scale(1.1);
        }

        .send-button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* Animations */
        @keyframes orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fast-orbit {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Glitch effect for name */
        .name {
            position: relative;
            display: inline-block;
        }

        .name::before,
        .name::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .name::before {
            color: #ff00ff;
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            animation: glitch 5s infinite;
        }

        .name::after {
            color: #00ffff;
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
            animation: glitch 5s 2.5s infinite;
        }

        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        /* Background stars effect */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 4s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* Media queries */
        @media (max-width: 768px) {
            .profile-container {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .name {
                font-size: 32px;
            }

            .bio {
                font-size: 16px;
                text-align: center;
            }

            .badges {
                max-width: 100%;
            }

            .social-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .theme-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }

            .chat-container {
                width: 95%;
                bottom: 110px;
            }
        }

        @media (max-width: 480px) {
            .name {
                font-size: 28px;
            }

            .chat-messages {
                height: 150px;
            }

            .chat-input {
                font-size: 14px;
            }

            .chat-input-container {
                flex-direction: column;
            }

            .send-button {
                width: 100%;
                height: 40px;
                border-radius: 10px;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body class="car-theme">

    <!-- Background stars -->
    <div class="stars" id="stars"></div>

    <!-- Background video -->
    <video id="background" autoplay loop muted playsinline webkit-playsinline>
        <source src="assets/car_background.mp4" type="video/mp4">
    </video>

    <!-- Profile content -->
    <div class="profile-container">
        <div class="header">
            <img src="assets/profile.gif" alt="Profile" class="profile-picture">
            <div class="profile-info">
                <h1 class="name" data-text="ZANE">ZANE</h1>
                <div class="badges">
                    <span class="badge">👑</span>
                    <span class="badge">💎</span>
                    <span class="badge">🌐</span>
                    <span class="badge">🎮</span>
                    <span class="badge">⚡</span>
                </div>
                <p class="bio">dev | coder | tech enthusiast | well known.</p>
            </div>
        </div>

        <div class="divider"></div>

        <div class="social-links">
            <a href="https://discord.gg/Kj4FFMC7aj" target="_blank">
                <img src="assets/discord.png" alt="Discord" class="social-icon">
            </a>
            <a href="https://www.instagram.com/zane_ox0?igsh=MWw3c2hiNXRwdGRmeQ==" target="_blank">
                <img src="assets/github.png" alt="Insta" class="social-icon">
            </a>
            <a href="https://www.youtube.com/@zaneyt3791" target="_blank">
                <img src="assets/youtube.png" alt="YouTube" class="social-icon">
            </a>
            <a href="https://www.roblox.com/users/2460326111/profile" target="_blank">
                <img src="assets/tiktok.png" alt="Roblox" class="social-icon">
            </a>
        </div>

        <div class="visitor-counter">
            <svg class="visitor-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
            <span id="visitor-count">921,235</span>
        </div>

        <div class="theme-buttons">
            <div class="theme-button">1</div>
            <div class="theme-button">2</div>
            <div class="theme-button">3</div>
            <div class="theme-button">4</div>
            <div class="theme-button">5</div>
        </div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-container">
        <div class="chat-header">
            <img src="assets/profile.gif" alt="Worm GPT" class="chat-avatar">
            <div class="chat-title">WORM GPT</div>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message ai-message">Hello! I'm Worm GPT. Ask me anything about coding, technology, or just say hello!</div>
        </div>
        <div class="chat-input-container">
            <input type="text" class="chat-input" id="chat-input" placeholder="Type your message here..." autocomplete="off">
            <button class="send-button" id="send-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="volume-control">
            <svg class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
            <input type="range" class="slider" min="0" max="1" step="0.01" value="0.3">
        </div>
    </div>

    <script>
        // Generate stars background
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 150;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random size between 1 and 3px
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                // Random position
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // Random animation delay
                star.style.animationDelay = `${Math.random() * 4}s`;
                
                starsContainer.appendChild(star);
            }
        }

        // Chat functionality
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            
            const chatInput = document.getElementById('chat-input');
            const sendButton = document.getElementById('send-button');
            const chatMessages = document.getElementById('chat-messages');
            const apiKey = 'zane'; // Your API key
            
            // Function to add message to chat
            function addMessage(text, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message');
                messageDiv.classList.add(isUser ? 'user-message' : 'ai-message');
                messageDiv.textContent = text;
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                // Add subtle glitch effect to new messages
                if (!isUser) {
                    messageDiv.style.animation = 'none';
                    setTimeout(() => {
                        messageDiv.style.animation = 'fadeIn 0.3s ease-out';
                    }, 10);
                }
            }
            
            // Function to show typing indicator
            function showTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.classList.add('typing-indicator');
                typingDiv.id = 'typing-indicator';
                typingDiv.innerHTML = `
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                `;
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // Function to hide typing indicator
            function hideTypingIndicator() {
                const typingIndicator = document.getElementById('typing-indicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }
            }
            
            // Function to get response from Worm GPT API
            async function getWormGptResponse(query) {
                try {
                    const response = await fetch(`https://worm-gpt-by-zane.vercel.app/api/gf?key=${apiKey}&q=${encodeURIComponent(query)}`);
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    const data = await response.json();
                    return data.response || "I couldn't process that request.";
                } catch (error) {
                    console.error('Error fetching from Worm GPT:', error);
                    return "Sorry, I'm having trouble connecting to the server right now.";
                }
            }
            
            // Handle sending a message
            async function sendMessage() {
                const message = chatInput.value.trim();
                if (!message) return;
                
                // Add user message
                addMessage(message, true);
                chatInput.value = '';
                
                // Show typing indicator
                showTypingIndicator();
                
                // Get response from API
                const response = await getWormGptResponse(message);
                
                // Hide typing indicator and add AI response
                hideTypingIndicator();
                addMessage(response);
            }
            
            // Event listeners for chat
            sendButton.addEventListener('click', sendMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // Add a welcome message with a slight delay to simulate thinking
            setTimeout(() => {
                addMessage("Welcome to ZANE's Worm GPT interface! Ask me anything about coding, technology, or just say hello!");
            }, 800);
        });
    </script>
</body>
</html>
